name: Sync CLI docs

# Production /docs/ tracks the latest CLI GitHub Release, not main.
# When the lock is behind, this regenerates the docs, verifies (test,
# check:docs, build), and commits straight to main — no PR — which triggers
# the Deploy workflow. The push needs the DOCS_PUSH_TOKEN secret: a push by
# the default github.token triggers no workflows, so Deploy would not fire.
# The CLI's release workflow dispatches this on each release; the hourly
# cron is the fallback for releases the dispatch missed.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "CLI tag (default: latest GitHub Release)"
        required: false

concurrency:
  group: sync-cli-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DARSAY_DOCS_ROOT: ${{ github.workspace }}/.ci-darsay
    steps:
      # With the PAT, the push to main acts as the token's owner and so
      # triggers the Deploy workflow — events from the default github.token
      # trigger no workflows at all.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.DOCS_PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Resolve CLI tag
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG=$(gh api repos/darsay-io/darsay/releases/latest --jq .tag_name)
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ref $TAG is not a vX.Y.Z tag" >&2; exit 1 ;;
          esac
          SHA=$(gh api "repos/darsay-io/darsay/commits/${TAG}" --jq .sha)
          LOCK_REF=$(jq -r .ref docs.lock.json)
          LOCK_SHA=$(jq -r .sha docs.lock.json)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$LOCK_REF" = "$TAG" ] && [ "$LOCK_SHA" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "docs.lock.json already at $TAG"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "bump $LOCK_REF ($LOCK_SHA) -> $TAG ($SHA)"
          fi

      - uses: actions/checkout@v5
        if: steps.cli.outputs.current != 'true'
        with:
          repository: darsay-io/darsay
          ref: ${{ steps.cli.outputs.sha }}
          path: .ci-darsay

      - name: Bump lock and regenerate
        if: steps.cli.outputs.current != 'true'
        env:
          PUBLIC_BOARDS_ENABLED: "true"
        run: |
          npm ci
          node scripts/bump-docs-lock.mjs "${{ steps.cli.outputs.tag }}" --force
          npm test
          npm run check:docs
          npm run build

      - name: Commit to main and push
        if: steps.cli.outputs.current != 'true'
        env:
          HAS_PUSH_TOKEN: ${{ secrets.DOCS_PUSH_TOKEN != '' }}
          TAG: ${{ steps.cli.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs.lock.json src/content/docs/docs scripts/snapshots public/darsay-logo.png src/assets/darsay-logo.png
          if git diff --cached --quiet; then
            echo "no file changes"
            exit 0
          fi
          git commit -m "docs: pin CLI docs to ${TAG}"
          # The retry absorbs a push that landed on main between checkout and
          # now; the generated files depend only on the lock, so the rebase
          # conflicts only if another docs pin raced this one — then this run
          # fails and the next cron run starts over from fresh main.
          git push origin main || { git pull --rebase origin main && git push origin main; }
          if [ "$HAS_PUSH_TOKEN" != "true" ]; then
            echo "pushed with github.token: Deploy will not auto-trigger;" \
              "set DOCS_PUSH_TOKEN, or run the Deploy workflow by hand"
          fi
