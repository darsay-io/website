name: Deploy

# Ships main to darsay.io. Runs automatically when a docs pin lands on main
# (the tail of release -> Sync CLI docs -> auto-merge) and on demand for
# anything else via workflow_dispatch. App changes outside these paths keep
# the deliberate manual deploy from ops/RUNBOOK.md.
#
# Needs repo secrets: CLOUDFLARE_API_TOKEN (Workers edit + D1 edit: the
# job applies pending migrations to the production database before the
# worker that needs them goes live) and CLOUDFLARE_ACCOUNT_ID
# (wrangler.jsonc carries no account_id).
on:
  push:
    branches: [main]
    paths:
      - docs.lock.json
      - src/content/docs/**
      - public/darsay-logo.png
      - src/assets/darsay-logo.png
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DARSAY_DOCS_ROOT: ${{ github.workspace }}/.ci-darsay
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Read docs.lock.json
        id: lock
        run: |
          echo "repo=$(jq -r .repo docs.lock.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .sha docs.lock.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.lock.outputs.repo }}
          ref: ${{ steps.lock.outputs.sha }}
          path: .ci-darsay

      - run: npm ci
      - run: npm test
      - run: npm run check:docs

      - run: npm run build
        env:
          PUBLIC_BOARDS_ENABLED: "true"

      # Schema before worker. A worker that writes a column its database
      # lacks answers 503 on every board write, and this job runs on its
      # own whenever a docs pin lands — so the database it deploys against
      # is brought up to date here, not from someone's laptop. Migrations
      # are additive and wrangler applies only the pending ones, so this is
      # a no-op on a docs-only deploy. Preview stays a RUNBOOK step: this
      # job never deploys the preview worker.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set; cannot deploy" >&2
            exit 1
          fi
          npx wrangler d1 migrations apply darsay-io --remote
          npx wrangler d1 migrations list darsay-io --remote

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env=""
